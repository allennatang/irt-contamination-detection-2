[project]
name = "icd2"
version = "0.1.0"
description = "IRT-based contamination detection, v2"
requires-python = ">=3.10"

# Exact pins recorded 2026-08-08 from the working .venv.
# v1 (which produced the reference artifacts) ran the versions in the
# trailing comments; see REBUILD_GUIDE.md "Version drift warning".
dependencies = [
    # numeric core — identical to v1, so the CPU regressions are directly comparable
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "pandas==2.3.3",

    # model stack — DRIFTED from v1; score-level regressions may not match to the bit
    "torch==2.13.0",           # v1: 2.12.1
    "transformers==5.14.1",    # v1: 5.13.0
    "peft==0.20.0",            # v1: 0.19.1
    "bitsandbytes==0.50.0",    # v1: 0.49.2
    "datasets==5.0.1",         # v1: 5.0.0
    "huggingface-hub==1.27.0", # v1: 1.22.0
    "accelerate==1.14.0",      # v1: 1.14.0 (match)
    "tokenizers==0.22.2",      # v1: 0.22.2 (match)
    "safetensors==0.8.0",      # v1: 0.8.0  (match)

    "trl==1.9.2",              # v1: NOT INSTALLED — no v1 baseline for the training path

    "fluid-benchmarking==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ipykernel==7.3.0"]

[tool.uv.sources]
fluid-benchmarking = { git = "https://github.com/allenai/fluid-benchmarking", rev = "d704b147489dc6b80051b1646561979cf7468f0a" }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
